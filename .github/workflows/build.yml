name: build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64 single executable
    runs-on: windows-latest
    defaults:
      run:
        working-directory: Slinky-source
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Clean stale build output
        shell: pwsh
        run: if (Test-Path build) { Remove-Item -Recurse -Force build }

      - name: Build payloads and native launcher
        shell: pwsh
        run: ./build.ps1

      - name: Verify the executable is self-contained
        shell: pwsh
        run: python tools/pe_resources.py build/native/Release/Slinky.exe

      - name: Upload single executable
        uses: actions/upload-artifact@v4
        with:
          name: Slinky-windows-x64
          path: Slinky-source/build/native/Release/Slinky.exe
          if-no-files-found: error

  linux:
    name: Linux x64 and example plugin
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Slinky-source
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Clean stale build output
        run: rm -rf build dist

      - name: Build payloads and native launcher
        run: bash ./build-linux.sh

      - name: Compile the example plugin on CI
        run: |
          mkdir -p "$HOME/.slinky/plugins" build/plugin-tool dist/plugins
          cp examples/plugins/ExamplePlugin.java "$HOME/.slinky/plugins/"
          javac -cp 'deps/tooling/*' -d build/plugin-tool tools/PluginBuilder.java tools/RemapJar.java
          java -cp 'build/plugin-tool:deps/tooling/*' PluginBuilder build/linux dist/plugins

      - name: Upload Linux distribution
        uses: actions/upload-artifact@v4
        with:
          name: Slinky-linux-x64
          path: Slinky-source/dist/linux-x86_64
          if-no-files-found: error

      - name: Upload example plugin jars
        uses: actions/upload-artifact@v4
        with:
          name: Slinky-example-plugins
          path: Slinky-source/dist/plugins
          if-no-files-found: error

  release:
    name: Attach single executable
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Slinky-windows-x64
          path: release

      - name: Publish release asset
        uses: softprops/action-gh-release@v2
        with:
          files: release/Slinky.exe
          fail_on_unmatched_files: true
